name: Deploying

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Run deploy.sh on remote server via sshpass
        run: |
          sshpass -p "${{ secrets.PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.USERNAME }}@${{ secrets.HOST }} << 'EOF'
          cd evently-desktop
          git stash
          git stash clear
          git pull
          npm install
          vue-tsc --noEmit
          vite build --base=/
          mkdir -p /usr/share/nginx/html/evently-app
          rm -rf /usr/share/nginx/html/evently-app/*
          mv dist/* /usr/share/nginx/html/evently-app/
          chown -R www-data:www-data /usr/share/nginx/html/evently-app
